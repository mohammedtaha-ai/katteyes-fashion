<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katteyes | لوحة التحكم والإدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #111111;
            --accent-color: #d4af37;
            --bg-light: #f4f6f9;
            --text-color: #333333;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-color); padding: 10px; }
        .admin-container { max-width: 800px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        h2 { color: var(--primary-color); margin-bottom: 15px; font-size: 18px; border-bottom: 2px solid var(--accent-color); padding-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; outline: none; font-size: 13px; background: #fff; transition: 0.3s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent-color); box-shadow: 0 0 5px rgba(212,175,55,0.2); }
        
        .helper-text { font-size: 11px; color: #777; margin-top: -4px; }
        
        .btn {
            background: var(--accent-color); color: #fff; padding: 10px 16px; border-radius: 8px;
            font-weight: bold; border: none; cursor: pointer; text-align: center; font-size: 13px; transition: 0.3s;
            display: inline-flex; align-items: center; justify-content: center; gap: 5px; text-decoration: none;
        }
        .btn:hover { background: #111; color: #fff; }
        .btn-cancel { background: #666; display: none; margin-top: 5px; }
        
        .section-box { background: #fafafa; padding: 12px; border-radius: 10px; border: 1px solid #eee; margin-top: 15px; }
        .section-box h3 { font-size: 15px; margin-bottom: 8px; color: #222; display: flex; align-items: center; gap: 6px; }

        .category-add-row { display: flex; gap: 6px; align-items: center; }
        .category-add-row input { flex: 1; min-width: 0; }
        .category-add-row button { flex-shrink: 0; padding: 10px 14px; }

        .admin-cats-grid { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 5px; margin-top: 8px; }
        .admin-cats-grid::-webkit-scrollbar { height: 3px; }
        .admin-cats-grid::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }
        
        .admin-cat-chip {
            background: #eee; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; transition: 0.3s; color: #444; flex-shrink: 0;
        }
        .admin-cat-chip.active { background: var(--primary-color); color: #fff; }

        .products-grid-admin { 
            margin-top: 12px; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 10px; 
        }
        
        .product-card-admin { 
            background: #fff; 
            border: 1px solid #eaeaea; 
            border-radius: 10px; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            transition: 0.3s;
        }
        .product-card-admin:hover { border-color: var(--accent-color); }
        
        .product-card-top { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
        .product-card-admin img { width: 55px; height: 55px; object-fit: cover; border-radius: 6px; border: 1px solid #eee; flex-shrink: 0; }
        
        .product-info h4 { font-size: 13px; color: #111; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
        .product-info p { font-size: 11px; color: #555; line-height: 1.3; }

        .action-btns { display: flex; gap: 5px; margin-top: 6px; border-top: 1px solid #f0f0f0; padding-top: 6px; }
        .action-btns button { flex: 1; padding: 6px; border-radius: 6px; font-size: 11px; font-weight: bold; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 3px; }
        .btn-edit { background: #fdf8e2; color: #b8860b; }
        .btn-edit:hover { background: var(--accent-color); color: #fff; }
        .btn-del { background: #fdf2f2; color: #d9534f; }
        .btn-del:hover { background: #d9534f; color: #fff; }

        #loadingMsg { display: none; color: #d4af37; font-weight: bold; font-size: 12px; text-align: center; background: #fff8e1; padding: 8px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2 id="formTitle"><i class="fa-solid fa-lock"></i> إضافة منتج جديد</h2>
        
        <!-- قسم إضافة/تعديل منتج -->
        <div class="form-group">
            <input type="text" id="pName" placeholder="اسم المنتج">
            <input type="number" id="pPrice" placeholder="السعر ($)">
            
            <label style="font-size: 12px;"><b>صور المنتج (يمكنك اختيار حتى 20 صورة بدقة عالية):</b></label>
            <input type="file" id="pImageFiles" accept="image/*" multiple>
            <span class="helper-text">💡 حدد مجموعة الصور دفعة واحدة وسيتم معالجتها بذكاء.</span>
            <div id="loadingMsg">⏳ جاري معالجة وتجهيز الصور، يرجى الانتظار...</div>

            <textarea id="pDesc" placeholder="وصف المنتج..." rows="2"></textarea>
            
            <input type="text" id="pColors" placeholder="الألوان (مثل: أحمر,أسود,أزرق)">
            <span class="helper-text">💡 اكتب كل لون مفصول بفاصلة (,) بدون مسافات.</span>
            
            <input type="text" id="pSizes" placeholder="المقاسات (مثل: S,M,L,XL)">
            <span class="helper-text">💡 اكتب كل مقاس مفصول بفاصلة (,).</span>
            
            <label style="font-size: 12px;"><b>قسم المنتج:</b></label>
            <select id="pCategory"></select>

            <button class="btn" id="saveBtn" onclick="saveProduct()" style="margin-top: 4px;"><i class="fa-solid fa-cloud-arrow-up"></i> نشر المنتج في المتجر</button>
            <button class="btn btn-cancel" id="cancelBtn" onclick="resetForm()">إلغاء التعديل</button>
        </div>

        <!-- قسم إضافة قسم جديد -->
        <div class="section-box">
            <h3><i class="fa-solid fa-folder-plus"></i> إدارة الأقسام</h3>
            <div class="category-add-row" style="margin-top: 6px;">
                <input type="text" id="newCategoryName" placeholder="اسم القسم الجديد (مثل: فساتين)">
                <button class="btn" onclick="addNewCategory()" style="background:#111;"><i class="fa-solid fa-plus"></i> إضافة</button>
            </div>
        </div>

        <!-- قائمة المنتجات الحالية مصنفة حسب الأقسام للحذف أو التعديل -->
        <div class="section-box">
            <h3><i class="fa-solid fa-boxes-stacked"></i> المنتجات الحالية حسب الأقسام</h3>
            
            <!-- أشرطة تصفح الأقسام -->
            <div class="admin-cats-grid" id="adminCatsBar"></div>

            <!-- شبكة عرض المنتجات -->
            <div class="products-grid-admin" id="adminProductsList"></div>
        </div>

        <!-- زر الانتقال لموقع العرض في أسفل الصفحة -->
        <div style="margin-top: 20px; text-align: center;">
            <a href="index.html" class="btn" style="width: 100%; background: var(--primary-color); padding: 12px; font-size: 14px;">
                <i class="fa-solid fa-store"></i> الانتقال إلى موقع العرض (المتجر)
            </a>
        </div>
    </div>

    <script>
        let categories = JSON.parse(localStorage.getItem('katteyes_categories')) || ["الكل", "نساء", "رجال", "أطفال", "عبايات", "فساتين"];
        let products = JSON.parse(localStorage.getItem('katteyes_products')) || [];
        let uploadedImagesBase64 = [];
        let editingIndex = null;
        let activeAdminCategory = "الكل";

        function processImageFile(file, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_DIMENSION = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_DIMENSION) {
                            height *= MAX_DIMENSION / width;
                            width = MAX_DIMENSION;
                        }
                    } else {
                        if (height > MAX_DIMENSION) {
                            width *= MAX_DIMENSION / height;
                            height = MAX_DIMENSION;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    callback(canvas.toDataURL('image/jpeg', 0.75));
                }
            }
        }

        document.getElementById('pImageFiles').addEventListener('change', function(e) {
            const files = e.target.files;
            uploadedImagesBase64 = [];
            if (files.length > 0) {
                document.getElementById('loadingMsg').style.display = 'block';
                let processedCount = 0;
                let totalFiles = files.length;
                
                for (let i = 0; i < totalFiles; i++) {
                    processImageFile(files[i], function(result) {
                        uploadedImagesBase64.push(result);
                        processedCount++;
                        if (processedCount === totalFiles) {
                            document.getElementById('loadingMsg').style.display = 'none';
                        }
                    });
                }
            }
        });

        function renderAdminCategories() {
            const select = document.getElementById('pCategory');
            select.innerHTML = "";
            categories.forEach(cat => {
                if(cat !== "الكل") {
                    select.innerHTML += `<option value="${cat}">${cat}</option>`;
                }
            });
            renderAdminCategoriesBar();
        }

        function renderAdminCategoriesBar() {
            const bar = document.getElementById('adminCatsBar');
            bar.innerHTML = "";
            let allCats = ["الكل", ...categories.filter(c => c !== "الكل")];
            allCats.forEach(cat => {
                bar.innerHTML += `<div class="admin-cat-chip ${activeAdminCategory === cat ? 'active' : ''}" onclick="selectAdminCategory('${cat}')">${cat}</div>`;
            });
        }

        function selectAdminCategory(cat) {
            activeAdminCategory = cat;
            renderAdminCategoriesBar();
            renderAdminProducts();
        }

        function addNewCategory() {
            const newCat = document.getElementById('newCategoryName').value.trim();
            if(!newCat) { alert('الرجاء كتابة اسم القسم!'); return; }
            if(categories.includes(newCat)) { alert('القسم موجود مسبقاً!'); return; }
            categories.push(newCat);
            try {
                localStorage.setItem('katteyes_categories', JSON.stringify(categories));
                document.getElementById('newCategoryName').value = '';
                renderAdminCategories();
                alert(`تم إضافة القسم "${newCat}" بنجاح!`);
            } catch (e) {
                alert('فشل الحفظ بسبب امتلاء الذاكرة.');
            }
        }

        function saveProduct() {
            const name = document.getElementById('pName').value.trim();
            const price = parseFloat(document.getElementById('pPrice').value);
            const desc = document.getElementById('pDesc').value.trim() || "لا يوجد وصف.";
            const category = document.getElementById('pCategory').value;
            
            const colorsInput = document.getElementById('pColors').value;
            const sizesInput = document.getElementById('pSizes').value;

            const colors = colorsInput ? colorsInput.split(',').map(c => c.trim()).filter(Boolean) : ["الافتراضي"];
            const sizes = sizesInput ? sizesInput.split(',').map(s => s.trim()).filter(Boolean) : ["مقاس واحد"];

            if(!name || isNaN(price)) {
                alert('الرجاء كتابة اسم المنتج والسعر الأساسي!');
                return;
            }

            if(editingIndex === null) {
                if(uploadedImagesBase64.length === 0) {
                    alert('الرجاء اختيار صورة واحدة على الأقل للمنتج!');
                    return;
                }
                let productObj = {
                    name: name,
                    price: price,
                    img: uploadedImagesBase64[0],
                    images: uploadedImagesBase64,
                    category: category,
                    desc: desc,
                    colors: colors,
                    sizes: sizes
                };
                products.push(productObj);
            } else {
                let targetProduct = products[editingIndex];
                targetProduct.name = name;
                targetProduct.price = price;
                targetProduct.category = category;
                targetProduct.desc = desc;
                targetProduct.colors = colors;
                targetProduct.sizes = sizes;

                if(uploadedImagesBase64.length > 0) {
                    targetProduct.img = uploadedImagesBase64[0];
                    targetProduct.images = uploadedImagesBase64;
                }
            }

            try {
                localStorage.setItem('katteyes_products', JSON.stringify(products));
                resetForm();
                renderAdminProducts();
                alert('✨ تم حفظ ونشر المنتج مع صوره المتعددة بنجاح تام!');
            } catch (error) {
                alert('❌ عذراً، حجم الصور كبير جداً أو تجاوز الحد الأقصى لذاكرة المتصفح.');
            }
        }

        function editProduct(index) {
            editingIndex = index;
            let p = products[index];

            document.getElementById('pName').value = p.name;
            document.getElementById('pPrice').value = p.price;
            document.getElementById('pDesc').value = p.desc;
            document.getElementById('pCategory').value = p.category;
            document.getElementById('pColors').value = p.colors ? p.colors.join(',') : '';
            document.getElementById('pSizes').value = p.sizes ? p.sizes.join(',') : '';

            document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-pen-to-square"></i> تعديل المنتج: ${p.name}`;
            document.getElementById('saveBtn').innerHTML = `<i class="fa-solid fa-floppy-disk"></i> حفظ التعديلات`;
            document.getElementById('cancelBtn').style.display = "inline-flex";
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            editingIndex = null;
            resetFormInputs();
            document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-lock"></i> إضافة منتج جديد`;
            document.getElementById('saveBtn').innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> نشر المنتج في المتجر`;
            document.getElementById('cancelBtn').style.display = "none";
        }

        function resetFormInputs() {
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pImageFiles').value = '';
            document.getElementById('pDesc').value = '';
            document.getElementById('pColors').value = '';
            document.getElementById('pSizes').value = '';
            uploadedImagesBase64 = [];
        }

        function renderAdminProducts() {
            const list = document.getElementById('adminProductsList');
            list.innerHTML = "";

            let filteredProducts = activeAdminCategory === "الكل" 
                ? products 
                : products.filter(p => p.category === activeAdminCategory);

            if(filteredProducts.length === 0) {
                list.innerHTML = '<p style="color:#777; text-align:center; padding:15px; grid-column: 1 / -1; font-size:12px;">لا توجد منتجات مضافة في هذا القسم بعد.</p>';
                return;
            }

            filteredProducts.forEach((p) => {
                let originalIndex = products.indexOf(p);
                let imgCount = p.images ? p.images.length : 1;
                list.innerHTML += `
                    <div class="product-card-admin">
                        <div>
                            <div class="product-card-top">
                                <img src="${p.img}">
                                <div class="product-info">
                                    <h4 title="${p.name}">${p.name}</h4>
                                    <p><b>$${p.price}</b></p>
                                    <p style="color:#777; font-size:10px;">القسم: ${p.category}</p>
                                </div>
                            </div>
                            <p style="font-size:10px; color:#666; margin-bottom:4px;">🖼️ ${imgCount} صور مرفقة</p>
                        </div>
                        <div class="action-btns">
                            <button class="btn-edit" onclick="editProduct(${originalIndex})"><i class="fa-solid fa-pen"></i> تعديل</button>
                            <button class="btn-del" onclick="deleteProduct(${originalIndex})"><i class="fa-solid fa-trash"></i> حذف</button>
                        </div>
                    </div>
                `;
            });
        }

        function deleteProduct(index) {
            if(confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                products.splice(index, 1);
                localStorage.setItem('katteyes_products', JSON.stringify(products));
                if(editingIndex === index) resetForm();
                renderAdminProducts();
            }
        }

        renderAdminCategories();
        renderAdminProducts();
    </script>
</body>
</html>
