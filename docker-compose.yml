services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports: ["${DB_PORT}:3306"]
    volumes:
      - katteyes_db_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT}:8025"
      - "1025:1025"

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports: ["${PHPMYADMIN_PORT}:80"]
    depends_on:
      mysql: { condition: service_healthy }

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    ports: ["${API_PORT}:8000"]
    volumes:
      - ./api:/var/www/html:cache
      - katteyes_storage:/var/www/html/storage
    depends_on:
      mysql:    { condition: service_healthy }
      mailpit:  { condition: service_started }

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile.dev
    env_file: .env
    ports: ["${WEB_PORT}:5173"]
    volumes:
      - ./web:/app:cache
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  katteyes_db_data:
  katteyes_storage:
  web_node_modules:
